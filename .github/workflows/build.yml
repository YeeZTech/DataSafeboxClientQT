name: Build & Release

# 触发条件：
#   - 推送到 feature/build 分支（每次出 test + prod 产物，仅上传为构建产物）
#   - 推送 release/v* 标签（例如 release/v1.0.4，额外创建 GitHub Release）
#   - 手动触发（workflow_dispatch）
on:
  push:
    branches: [ feature/build ]
    tags:     [ 'release/v*' ]
  workflow_dispatch:

# 同一分支/标签的旧构建在新构建开始时取消，避免排队浪费 runner 时长
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Windows — MSVC2022 + Qt 6.7.3 + Qt IFW → .exe 安装包
  # test:  USE_TEST_ENV=1  →  DataSafebox_<version>_test.exe
  # prod:  USE_TEST_ENV=0  →  DataSafebox_<version>.exe
  # ============================================================
  build-windows:
    name: Windows (${{ matrix.env_name }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - { env_name: test, use_test_env: '1' }
          - { env_name: prod, use_test_env: '0' }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 安装 Qt（含 WebEngine + Qt Installer Framework）
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host:    'windows'
          target:  'desktop'
          arch:    'win64_msvc2019_64'   # Qt 6.7.3 ships no msvc2022 build; this is ABI-compatible with MSVC 2022
          modules: 'qtwebengine qtwebchannel qtpositioning qtlocation qtquick3d'
          tools:   'tools_ifw'
          cache:   true

      # 定位 Qt Installer Framework 的 binarycreator.exe，供 build_installer.bat 使用
      - name: Resolve Qt IFW path
        shell: pwsh
        run: |
          $bc = Get-ChildItem -Path (Join-Path $env:QT_ROOT_DIR '..\..') -Recurse `
                  -Filter binarycreator.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $bc) { Write-Error 'binarycreator.exe not found under Qt install dir'; exit 1 }
          "IFW_BIN=$($bc.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "IFW_BIN=$($bc.DirectoryName)"

      # vcpkg 缓存 + 安装 sentry-native（x64-windows）
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: C:/vcpkg/installed
          key:  vcpkg-windows-sentry-${{ hashFiles('vcpkg.json') }}

      - name: Install sentry-native (vcpkg)
        shell: pwsh
        env:
          VCPKG_ROOT: C:/vcpkg
        # --classic：本仓库根有 vcpkg.json，默认会进入 manifest 模式而拒绝单包安装
        run: C:/vcpkg/vcpkg.exe install sentry-native --triplet x64-windows --classic

      # 下载并解压对应环境的 DSCC SDK（私有仓库，需要 DSCC_TOKEN）
      - name: Download DSCC SDK (${{ matrix.env_name }})
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DSCC_TOKEN }}
        run: |
          $asset = "dscc-sdk-win64-${{ matrix.env_name }}.zip"
          gh release download feature-build --repo YeeZTech/data-safebox-core `
            --pattern $asset --dir dscc-zip
          New-Item -ItemType Directory -Force dscc-sdk | Out-Null
          tar -xf "dscc-zip/$asset" -C dscc-sdk
          $hdr = Get-ChildItem -Path dscc-sdk -Recurse -Filter active_notify.h -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match 'include\\dscc\\core\\common' } | Select-Object -First 1
          if (-not $hdr) { Write-Error 'DSCC SDK header not found after extraction'; exit 1 }
          $dscc = $hdr.FullName -replace '\\include\\dscc\\core\\common\\active_notify\.h$',''
          "DSCC_DIR=$dscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "DSCC_DIR=$dscc"

      # 编译 + 打包（build_installer.bat 内部完成 lrelease/qmake/nmake/windeployqt/IFW）
      - name: Build & package installer
        shell: cmd
        env:
          USE_TEST_ENV:    ${{ matrix.use_test_env }}
          SENTRY_ROOT_DIR: C:/vcpkg/installed/x64-windows
          # DSCC_DIR 与 IFW_BIN 已通过 GITHUB_ENV 注入
        run: call builder\windows\build_installer.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DataSafebox-windows-${{ matrix.env_name }}
          path: builder/windows/DataSafebox_*.exe
          if-no-files-found: error
          retention-days: 30

  # ============================================================
  # macOS (Apple Silicon) — Clang + Qt 6.7.3 + macdeployqt → .dmg
  # test:  USE_TEST_ENV=1  →  DataSafebox_<version>_test.dmg
  # prod:  USE_TEST_ENV=0  →  DataSafebox_<version>.dmg
  # ============================================================
  build-macos:
    name: macOS (${{ matrix.env_name }})
    runs-on: macos-14        # Apple Silicon (arm64) — 与 DSCC macos-arm64 包匹配
    strategy:
      fail-fast: false
      matrix:
        include:
          - { env_name: test, use_test_env: '1' }
          - { env_name: prod, use_test_env: '0' }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 安装 Qt（含 WebEngine）
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host:    'mac'
          target:  'desktop'
          arch:    'clang_64'
          modules: 'qtwebengine qtwebchannel qtpositioning qtlocation qtquick3d'
          cache:   true

      # 构建依赖：图标渲染(librsvg) + pkg-config + sentry-native(arm64) + Pillow
      - name: Install build dependencies (Homebrew)
        run: brew install librsvg pkg-config sentry-native

      - name: Install Pillow
        run: python3 -m pip install --break-system-packages --quiet Pillow

      # 下载并解压对应环境的 DSCC SDK（私有仓库，需要 DSCC_TOKEN）
      - name: Download DSCC SDK (${{ matrix.env_name }})
        env:
          GH_TOKEN: ${{ secrets.DSCC_TOKEN }}
        run: |
          asset="dscc-sdk-macos-arm64-${{ matrix.env_name }}.zip"
          gh release download feature-build --repo YeeZTech/data-safebox-core \
            --pattern "$asset" --dir dscc-zip
          mkdir -p dscc-sdk
          tar -xf "dscc-zip/$asset" -C dscc-sdk
          header="$(find dscc-sdk -path '*/include/dscc/core/common/active_notify.h' | head -1)"
          if [ -z "$header" ]; then echo 'DSCC SDK header not found after extraction'; exit 1; fi
          dscc="${header%/include/dscc/core/common/active_notify.h}"
          echo "DSCC_DIR=$dscc" >> "$GITHUB_ENV"
          echo "DSCC_DIR=$dscc"

      # 编译 + 打包（build_dmg.sh 内部完成 lrelease/qmake/make/macdeployqt/签名/制作 dmg）
      - name: Build & package dmg
        env:
          USE_TEST_ENV: ${{ matrix.use_test_env }}
        run: |
          export QT_DIR="$QT_ROOT_DIR"
          export SENTRY_ROOT_DIR="$(brew --prefix sentry-native)"
          chmod +x builder/macos/build_dmg.sh
          ./builder/macos/build_dmg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DataSafebox-macos-${{ matrix.env_name }}
          path: builder/macos/DataSafebox_*.dmg
          if-no-files-found: error
          retention-days: 30

  # ============================================================
  # Release：推送 release/v* 标签时，把 4 个产物发布到 GitHub Release
  # ============================================================
  release:
    name: Create GitHub Release
    needs: [ build-windows, build-macos ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/release/v')

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/DataSafebox-windows-test/DataSafebox_*.exe
            artifacts/DataSafebox-windows-prod/DataSafebox_*.exe
            artifacts/DataSafebox-macos-test/DataSafebox_*.dmg
            artifacts/DataSafebox-macos-prod/DataSafebox_*.dmg
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
